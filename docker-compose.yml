version: '3.8'

# AgentHub Docker Compose - 一键启动全部服务
# 用法：docker compose up -d

services:
  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: agenthub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: agenthub
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis 7 ==========
  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Elasticsearch 8.11（限 512MB 内存）==========
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: agenthub-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ========== Go 切分微服务 ==========
  chunker:
    build:
      context: ./chunker
      dockerfile: Dockerfile
    container_name: agenthub-chunker
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis

  # ========== AgentHub 后端 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenthub-backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - CHAT_MODEL=${CHAT_MODEL:-qwen3.7-plus}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-v4}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root123}
      - MYSQL_DATABASE=agenthub
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_DIR=/app/data/chroma
      - CHUNKER_URL=http://chunker:8080
      - ES_HOST=http://elasticsearch:9200
      - TZ=Asia/Shanghai
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      chunker:
        condition: service_started
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8002
      --reload

# ========== 数据卷 ==========
volumes:
  mysql_data:
  redis_data:
  es_data:
  chroma_data:
